<html lang="zh-CN">
<head>

<style>
:root{color-scheme:dark;--bg:#1c1a18;--panel:#252320;--line:#3a3730;--muted:#aaa393;--text:#e8e4dc;--gold:#d4a853;--green:#9ac592;--red:#e2a08f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button{border:1px solid #514a3e;border-radius:6px;background:transparent;color:var(--text);padding:8px 14px}.primary{background:var(--gold);color:#241e12;border-color:var(--gold);font-weight:600}.quiet{border:0;color:var(--muted)}.danger{color:var(--red)}input,select,textarea{border:1px solid #514a3e;background:#1e1c19;color:var(--text);border-radius:5px;padding:9px 10px}input[type=number]{width:108px}input:read-only{border-color:transparent;background:transparent}small,.muted{color:var(--muted)}small{display:block;font-size:12px}h1,h2,h3,p{margin:0}h1{font-size:28px;font-weight:600;letter-spacing:1px}h2{font-size:20px}h3{font-size:15px}a{color:var(--gold)}[hidden]{display:none!important}.demo{background:#373023;border-bottom:1px solid #5a4930;color:#e2c893;text-align:center;padding:7px 18px;font-size:12px}.top{height:64px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-weight:600}.mark{width:30px;height:30px;border:1px solid #d4a85366;border-radius:7px;display:grid;place-items:center;color:var(--gold)}.layout{display:grid;grid-template-columns:178px minmax(0,1fr);min-height:calc(100vh - 99px)}aside{padding:28px 15px;border-right:1px solid var(--line)}aside small{padding:0 12px 14px}aside div{padding:10px 12px;color:var(--muted);margin:4px 0}.active-nav{color:var(--gold);background:#d4a85312;border-radius:6px}main{padding:34px 38px 100px;max-width:1600px;width:100%;margin:auto}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.heading p{margin-top:7px;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}.stat{padding:20px 22px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.stat strong{font-size:30px;margin-right:10px;font-weight:550}.stat span{color:var(--muted);font-size:12px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.filters input{flex:1;min-width:180px}.panel{border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{font-size:12px;font-weight:400;color:var(--muted);background:#292620;padding:13px 16px}td{padding:17px 16px;border-top:1px solid var(--line);font-size:13px}td strong{font-weight:550}td small{margin-top:3px}.badge{display:inline-block;background:#ffffff08;color:#bcb6aa;padding:3px 9px;border-radius:5px;font-size:12px}.badge.gold{color:#e5bf74;background:#d4a85314}.badge.green{color:var(--green);background:#7fa87515}.badge.red{color:var(--red);background:#c4543e15}.table-foot{padding:14px 18px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between}.back{padding-left:0;margin-bottom:14px}.notice{padding:13px 17px;border:1px solid #d4a85340;background:#d4a8530b;border-radius:7px;font-size:13px;margin:18px 0}.notice small{margin-top:3px}.steps{display:flex;gap:10px;align-items:center;margin:22px 0;color:#777166;font-size:12px;flex-wrap:wrap}.steps .current{color:var(--gold)}.steps .finished{color:var(--green)}.steps i{font-style:normal;color:#5c5547}.detail-meta{display:flex;gap:35px;flex-wrap:wrap;margin-top:14px}.detail-meta strong{display:block;font-size:13px;margin-top:3px}.progress-wrap{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.progress{width:180px;background:#3a3730;border-radius:3px;height:5px;margin-top:7px;overflow:hidden}.progress div{height:100%;background:var(--gold);transition:width .2s}.pills{display:flex;gap:5px;flex-wrap:wrap}.pills button{font-size:12px;padding:5px 10px;border-color:transparent;color:var(--muted)}.pills .selected{color:var(--gold);background:#d4a85314;border-color:#d4a85330}.count-table td{vertical-align:top}.count-table .changed{background:#d4a85305}.count-table input,.count-table select{font-size:13px}.reason{width:150px}.note{width:150px;margin-top:6px}.positive{color:var(--green)}.negative{color:var(--red)}.empty{text-align:center;padding:45px;color:var(--muted)}.footer{position:sticky;bottom:0;background:#252320f5;border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:16px;backdrop-filter:blur(12px)}.footer small{font-size:12px}.actions{display:flex;gap:9px;flex-wrap:wrap}.review{display:grid;grid-template-columns:1fr 300px;gap:20px;margin-top:20px}.review .panel{padding:21px}.timeline{margin-top:14px}.event{padding:0 0 18px 18px;border-left:1px solid #514a3e;position:relative;font-size:13px}.event:before{content:'';position:absolute;left:-4px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--gold)}.event:last-child{padding-bottom:0}.event p{color:var(--muted);font-size:12px;margin-top:3px}.review-note{font-size:13px;color:var(--muted);margin:12px 0}.demo-tools{padding:14px 18px;background:#1f1d19;border:1px dashed #53462e;border-radius:8px;margin-top:20px}.demo-tools small{margin-bottom:10px}.mask{position:fixed;inset:0;background:#0009;z-index:5;display:flex;justify-content:center;align-items:center;padding:20px}.dialog{width:520px;max-width:100%;max-height:90vh;overflow:auto;border:1px solid #514a3e;border-radius:12px;background:var(--panel);padding:26px;box-shadow:0 20px 80px #0008}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog label{display:grid;gap:7px;margin-top:18px;font-size:13px}.dialog .actions{justify-content:flex-end;margin-top:24px}.dialog textarea{resize:vertical;min-height:80px}.error{color:var(--red);font-size:13px;margin-top:12px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:9;background:#3c4433;color:#e1edd5;padding:12px 22px;border:1px solid #6b7e52;border-radius:8px;max-width:90vw}.ref{margin-top:16px;color:var(--muted);font-size:12px}.save-state{color:var(--green)}
@media(max-width:1050px){.layout{grid-template-columns:1fr}aside{display:none}main{padding:25px 20px 70px}.review{grid-template-columns:1fr}.count-table{min-width:1000px}.top{padding:0 20px}}@media(max-width:600px){h1{font-size:23px}.heading{align-items:flex-start}.heading p{max-width:230px}.top .muted{display:none}.stats{gap:8px}.stat{padding:12px}.stat strong{display:block;font-size:25px}.footer{align-items:stretch;flex-direction:column}.progress-wrap{align-items:flex-start;flex-direction:column}.detail-meta{gap:15px}.steps{gap:6px}.card-view table,.card-view tbody{display:block}.card-view thead{display:none}.card-view tr{display:grid;grid-template-columns:1fr 1fr;padding:12px;border-top:1px solid var(--line)}.card-view td{display:block;border:0;padding:6px}.card-view td:first-child{grid-column:1/-1}.card-view td:last-child{grid-column:1/-1}.count-table{min-width:0}.count-table td:before{content:attr(data-label);display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.count-table .reason,.count-table .note{width:100%}.count-table input[type=number]{width:100%}.demo{font-size:11px}.dialog{padding:20px}}
</style>
</head>
<body>
<div class="demo">交互设计预览 · 全部为示例数据，操作不会连接或修改实际库存</div>
<header class="top"><div class="brand"><span class="mark">酿</span>精酿生产管理 <span class="muted" style="font-weight:400;margin-left:15px">库存采购</span></div><span class="muted">示例酒厂 · 库管工作区</span></header>
<div class="layout"><aside><small>库存采购</small><div>总览</div><div>库存</div><div>采购需求</div><div>采购执行</div><div>质检入库</div><div>生产领料</div><div class="active-nav">库存盘点</div><div>对账导出</div></aside><main id="app"></main></div>
<div id="mask" class="mask" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="quiet" id="close-dialog" aria-label="关闭">×</button></div><form id="dialog-form"><div id="dialog-body"></div><p class="error" id="dialog-error" role="alert"></p><div class="actions"><button type="button" id="cancel-dialog">取消</button><button class="primary" id="dialog-submit" type="submit">确认</button></div></form></section></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storageKey='brew-inventory-count-design-v1',labels={draft:'未开始',counting:'盘点中',review:'待审批',returned:'已退回',approved:'待入账',done:'已完成',cancelled:'已取消'};
const reasonLabels={measurement:'计量误差',damage:'破损',expired:'过期报废',missing_transaction:'单据未及时入账',unrecorded_issue_return:'领退料未登记',other:'其他'};
const fixedRows=()=>[
 {id:'malt1',location:'A01',product:'澳洲皮尔森麦芽',spec:'25 kg / 袋',lot:'MALT-261015-01',unit:'kg',book:500,reserved:100,actual:null,reason:'',note:'',previous:500},
 {id:'malt2',location:'A01',product:'小麦芽',spec:'25 kg / 袋',lot:'MALT-261020-02',unit:'kg',book:150,reserved:0,actual:null,reason:'',note:'',previous:200},
 {id:'malt3',location:'A01',product:'焦糖麦芽',spec:'25 kg / 袋',lot:'MALT-261018-03',unit:'kg',book:50,reserved:0,actual:null,reason:'',note:'',previous:null}
];
const stamp=()=>new Date().toLocaleString('zh-CN',{hour12:false});
function initial(){return [{id:'PD-示例-001',scope:'原料仓 / A01',warehouse:'原料仓',bin:'A01',state:'counting',owner:'张库管',created:'2026/11/2 09:00',started:'2026/11/2 09:05',rows:fixedRows(),events:[{title:'开始盘点 · 张库管',at:'2026/11/2 09:05',note:'A01 已暂停收发，生成账面快照'}]}, {id:'PD-示例-002',scope:'包材仓 / B01',warehouse:'包材仓',bin:'B01',state:'approved',owner:'李库管',created:'2026/11/2 08:30',started:'2026/11/2 08:35',rows:[{id:'bottle',location:'B01',product:'330 mL 棕色玻璃瓶',spec:'24 个 / 箱',lot:'PK-261025-01',unit:'个',book:2400,reserved:0,actual:2398,reason:'damage',note:'两只瓶口破损，已复核',previous:2400}],events:[{title:'开始盘点 · 李库管',at:'2026/11/2 08:35',note:'B01 已暂停收发'},{title:'提交差异 · 李库管',at:'2026/11/2 08:50',note:'盘亏 2 个，原因：破损'},{title:'审批通过 · 王负责人',at:'2026/11/2 09:10',note:'核实破损后通过，等待库管确认入账'}]}];}
let docs;try{const saved=JSON.parse(localStorage.getItem(storageKey));docs=Array.isArray(saved)&&saved.every(x=>x.id&&labels[x.state]&&Array.isArray(x.rows)&&Array.isArray(x.events))?saved:initial();}catch{docs=initial();}
let current=null,listState='',listSearch='',lineMode='all',lineSearch='',toastTimer,dialogCallback,opener;
const currentDoc=()=>docs.find(x=>x.id===current),editable=d=>['counting','returned'].includes(d.state),frozen=d=>['counting','review','returned','approved'].includes(d.state);
const counted=r=>r.actual!==null&&r.actual!==''&&Number.isFinite(Number(r.actual))&&Number(r.actual)>=0;
const delta=r=>counted(r)?Math.round((Number(r.actual)-r.book)*1000000)/1000000:null;
const changed=r=>delta(r)!==null&&Math.abs(delta(r))>0.000001;
const format=n=>Number(n).toLocaleString('zh-CN',{maximumFractionDigits:3});
const badge=d=>`<span class="badge ${d.state==='done'?'green':['review','approved','counting'].includes(d.state)?'gold':d.state==='returned'?'red':''}">${labels[d.state]}</span>`;
function event(d,title,note){d.events.push({title,at:stamp(),note});}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(docs));return true;}catch{toast('当前浏览器无法保存预览数据，请保持页面打开');return false;}}
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,4000);}
function commit(message){persist();render();if(message)toast(message);}
function render(){if(current&&!currentDoc())current=null;current?renderDetail():renderList();}
function renderList(){
 const visible=docs.filter(d=>(!listState||d.state===listState)&&(!listSearch||(d.id+' '+d.scope).includes(listSearch)));
 const buttons={draft:'开始盘点',counting:'继续盘点',review:'查看审批',returned:'修改并重提',approved:'核对并入账',done:'查看记录',cancelled:'查看记录'};
 $('app').innerHTML=`<div class="heading"><div><h1>库存盘点</h1><p>按库位清点实物，让每一笔差异都有依据。</p></div><button class="primary" data-action="create">＋ 新建盘点</button></div><div class="stats">${[['进行中',docs.filter(d=>['counting','returned'].includes(d.state)).length,'实盘录入与差异核查'],['待审批',docs.filter(d=>d.state==='review').length,'提交后等待负责人复核'],['待入账',docs.filter(d=>d.state==='approved').length,'审批通过，等待确认调整']].map(([l,n,s])=>`<div class="stat"><span>${l}</span><div><strong>${n}</strong><span>张</span></div><small>${s}</small></div>`).join('')}</div><div class="filters"><input id="list-search" aria-label="搜索盘点单" placeholder="搜索盘点单号、仓库或库位" value="${esc(listSearch)}"><select id="list-state" aria-label="盘点状态"><option value="">全部状态</option>${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${listState===k?'selected':''}>${v}</option>`).join('')}</select><button data-action="filter">查询</button></div><div class="panel"><div class="scroll"><table><thead><tr><th>盘点单 / 创建时间</th><th>盘点范围</th><th>负责人</th><th>实盘进度</th><th>差异</th><th>状态</th><th>操作</th></tr></thead><tbody>${visible.map(d=>`<tr><td><strong>${esc(d.id)}</strong><small>${esc(d.created)}</small></td><td>${esc(d.scope)}<small>${frozen(d)?'● 该范围已暂停收发':d.state==='draft'?'开始后暂停所选范围收发':'收发正常'}</small></td><td>${esc(d.owner)}</td><td>${d.rows.filter(counted).length} / ${d.rows.length} 项</td><td>${d.rows.filter(changed).length} 项</td><td>${badge(d)}</td><td><button data-open="${esc(d.id)}">${buttons[d.state]}</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">没有匹配的盘点单</td></tr>'}</tbody></table></div><div class="table-foot"><span>共 ${visible.length} 张盘点单</span><span>示例酒厂 · 按单据保留盘点与审批记录</span></div></div><p class="ref">先打开“继续盘点”体验录入，或打开“核对并入账”查看差异审批后的处理。</p><div class="demo-tools"><small>预览工具 · 仅用于重新体验设计</small><button data-action="reset">重置全部示例数据</button></div>`;
}
function summary(d){const groups={};for(const r of d.rows.filter(changed)){const g=groups[r.unit]??={up:0,down:0};g.up+=Math.max(delta(r),0);g.down+=Math.max(-delta(r),0);}return Object.entries(groups).map(([u,g])=>`${g.up?'盘盈 '+format(g.up)+' '+u:''}${g.up&&g.down?' / ':''}${g.down?'盘亏 '+format(g.down)+' '+u:''}`).join('；')||'暂无盘点差异';}
function issue(d){if(!d.rows.length)return '尚无盘点明细，请补录现场发现的库存，或确认本范围为空库位。';const incomplete=d.rows.filter(r=>!counted(r));if(incomplete.length)return `还有 ${incomplete.length} 项未完成实盘，零库存请明确填写 0。`;const bad=d.rows.filter(r=>changed(r)&&(!r.reason||(r.reason==='other'&&!r.note.trim())));if(bad.length)return `还有 ${bad.length} 项差异缺少原因或必要说明。`;const reserved=d.rows.find(r=>Number(r.actual)<r.reserved);if(reserved)return `${reserved.product} 实盘少于已预占 ${format(reserved.reserved)} ${reserved.unit}，请先核查受影响的生产计划。`;return '';}
function renderDetail(){const d=currentDoc(),done=d.rows.filter(counted).length,canEdit=editable(d),stage={draft:0,counting:1,returned:2,review:2,approved:3,done:4,cancelled:-1}[d.state];
 const filtered=d.rows.filter(r=>(!lineSearch||(r.product+' '+r.lot+' '+r.location).includes(lineSearch))&&(lineMode==='all'||lineMode==='unseen'&&!counted(r)||lineMode==='difference'&&changed(r)||lineMode==='counted'&&counted(r)));
 $('app').innerHTML=`<button class="quiet back" data-action="back">← 全部盘点单</button><div class="heading"><div><h1>${esc(d.id)} <span style="vertical-align:middle">${badge(d)}</span></h1><p>${esc(d.scope)} · 逐项清点，核查后提交</p></div>${canEdit?'<button data-action="add">＋ 补录发现库存</button>':''}</div><div class="detail-meta"><div><small>盘点范围</small><strong>${esc(d.scope)} · 包含子库位</strong></div><div><small>盘点负责人</small><strong>${esc(d.owner)}</strong></div><div><small>账面快照时间</small><strong>${esc(d.started||'尚未开始')}</strong></div></div><div class="steps">${['确认范围','实盘录入','差异审批','确认入账','盘点完成'].map((s,i)=>`${i?'<i>—</i>':''}<span class="${i===stage?'current':i<stage?'finished':''}">${i+1} ${s}</span>`).join('')}</div><div class="notice">${frozen(d)?`● ${esc(d.scope)} 已暂停收发；其他库位照常作业。<small>提交审批后继续保留暂停状态，完成或取消本单后恢复。批次原有质量冻结保持不变。</small>`:d.state==='draft'?'当前尚未冻结。开始后生成账面快照，并暂停所选范围的实物收发。':d.state==='cancelled'?'本单已取消，未调整库存；所选范围已恢复收发。':'本单已完成，所选范围已恢复收发。调整记录已关联本单。'}</div>${d.state==='returned'?`<div class="notice" style="border-color:#c4543e66">审批退回：${esc(d.returnNote)}<small>修改实盘或补充说明后重新提交，保留原有审核记录。</small></div>`:''}<div class="panel"><div class="progress-wrap"><div><strong>已盘 ${done} / ${d.rows.length} 项</strong><div class="progress"><div style="width:${d.rows.length?done/d.rows.length*100:0}%"></div></div></div><span class="muted">差异 ${d.rows.filter(changed).length} 项 · ${esc(summary(d))}</span></div><div class="filters" style="padding:0 16px"><input id="line-search" aria-label="搜索盘点明细" value="${esc(lineSearch)}" placeholder="搜索商品、批次或库位"><button data-action="line-search">查找</button><div class="pills">${[['all','全部'],['unseen','未盘'],['counted','已盘'],['difference','有差异']].map(([k,v])=>`<button data-mode="${k}" class="${lineMode===k?'selected':''}">${v}</button>`).join('')}</div></div><div class="scroll card-view"><table class="count-table"><thead><tr><th>商品 / 批次 / 库位</th><th>账面 / 已预占</th><th>实盘数量</th><th>差异</th><th>原因与说明</th><th>核查</th></tr></thead><tbody>${filtered.map(r=>`<tr class="${changed(r)?'changed':''}"><td data-label="商品 / 批次"><strong>${esc(r.product)}</strong><small>${esc(r.spec)} · ${esc(r.unit)}</small><small>${esc(r.lot)} · ${esc(r.location)}</small></td><td data-label="账面数量">${format(r.book)} ${esc(r.unit)}<small>已预占 ${format(r.reserved)} ${esc(r.unit)}</small></td><td data-label="本次实盘"><input type="number" min="0" step="any" aria-label="${esc(r.product)}实盘数量" data-row="${esc(r.id)}" data-field="actual" value="${r.actual===null?'':esc(r.actual)}" placeholder="未盘" ${!canEdit?'readonly':''}><small>${counted(r)?'已记录实盘':'请填写实际清点数量'}</small></td><td data-label="差异"><strong class="${delta(r)>0?'positive':delta(r)<0?'negative':''}">${delta(r)===null?'—':(delta(r)>0?'+':'')+format(delta(r))+' '+esc(r.unit)}</strong><small>${!counted(r)?'尚未盘点':changed(r)?'需要核查原因':'账实一致'}</small></td><td data-label="差异原因">${changed(r)?`<select class="reason" aria-label="${esc(r.product)}差异原因" data-row="${esc(r.id)}" data-field="reason" ${!canEdit?'disabled':''}><option value="">请选择原因</option>${Object.entries(reasonLabels).map(([k,v])=>`<option value="${k}" ${r.reason===k?'selected':''}>${v}</option>`).join('')}</select><br><input class="note" aria-label="${esc(r.product)}差异说明" data-row="${esc(r.id)}" data-field="note" value="${esc(r.note)}" placeholder="${r.reason==='other'?'请填写差异说明':'补充说明（选填）'}" ${!canEdit?'readonly':''}>`:'<span class="muted">—</span>'}</td><td data-label="核查记录">${canEdit&&counted(r)?`<button data-recount="${esc(r.id)}">复盘</button>`:''}<small>${r.previous===null?'上次：无记录':'上次：'+format(r.previous)+' '+esc(r.unit)}</small>${r.recounts?.map(x=>`<small>复盘 ${esc(x.before)} → ${esc(x.after)}<br>${esc(x.at)}</small>`).join('')||''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">没有匹配的明细</td></tr>'}</tbody></table></div></div><div class="footer"><div><span id="save-state" class="save-state">${d.saved?'预览数据已暂存 · '+esc(d.saved):canEdit?'可随时暂存，填写 0 表示现场实盘为零':'核对单据后处理当前事项'}</span><small>${canEdit?esc(issue(d)||'已完成全部录入，可以提交核查'):d.state==='approved'?'确认后生成盘盈/盘亏流水，并恢复所选范围收发。':d.state==='review'?'等待负责人复核，当前实盘记录不可修改。':d.state==='done'?'记录已锁定，保留本次实盘及调整依据。':''}</small></div><div class="actions">${['draft','counting','returned','review','approved'].includes(d.state)?'<button class="quiet danger" data-action="cancel">取消本单</button>':''}${d.state==='draft'?'<button class="primary" data-action="start">确认范围并开始</button>':canEdit?'<button data-action="save">暂存</button><button class="primary" data-action="submit">'+(d.rows.some(changed)?'提交差异审批':'核对并结束盘点')+'</button>':d.state==='approved'?'<button class="primary" data-action="post">确认差异并入账</button>':''}</div></div><div class="review"><section class="panel"><h3>${d.state==='done'?'入账结果':'本次差异说明'}</h3><p class="review-note">${esc(summary(d))}。${d.state==='done'?'本单已结束，不再允许修改实盘数据。':'盘点按实物账面量核对，预占量不从应盘数量中扣除。'}</p>${d.state==='done'&&d.movements?.length?d.movements.map(m=>`<p style="margin-top:8px"><span class="badge ${m.quantity>0?'green':'red'}">${m.quantity>0?'盘盈':'盘亏'}</span> ${esc(m.product)} · ${format(Math.abs(m.quantity))} ${esc(m.unit)}<small>示例流水 ${esc(m.id)} · 来源 ${esc(d.id)}</small></p>`).join(''):'<small>盘亏影响已有预占时先核查生产计划；发现移库漏登记时先核实业务，避免误记损益。</small>'}</section><section class="panel"><h3>处理记录</h3><div class="timeline">${[...d.events].reverse().map(e=>`<div class="event">${esc(e.title)}<p>${esc(e.at)}</p><p>${esc(e.note)}</p></div>`).join('')||'<p class="muted">尚未开始</p>'}</div></section></div>${d.state==='review'?'<div class="demo-tools"><small>审批场景演示 · 正式系统由有权限的审批人处理</small><div class="actions"><button data-action="approve">模拟负责人审批通过</button><button data-action="return">模拟审批退回</button></div></div>':''}`;
}
function openDialog(title,body,button,callback){opener=document.activeElement;$('dialog-title').textContent=title;$('dialog-body').innerHTML=body;$('dialog-submit').textContent=button;$('dialog-error').textContent='';dialogCallback=callback;$('mask').hidden=false;document.querySelector('.dialog').focus();}
function closeDialog(){$('mask').hidden=true;dialogCallback=null;if(opener?.isConnected)opener.focus();}
function create(){openDialog('新建库存盘点','<p class="review-note">选择本次盘点范围。开始前不会暂停收发。</p><label>厂区<select name="factory"><option>示例酒厂</option></select></label><label>仓库<select name="warehouse"><option>原料仓</option><option>包材仓</option><option>成品仓</option></select></label><label>盘点库位<select name="bin"><option value="A01">原料仓 / A01</option><option value="A02">原料仓 / A02</option><option value="B01">包材仓 / B01</option><option value="C01">成品仓 / C01</option></select></label><p class="ref">范围包含所选库位及其子库位；第一版按所选库位全盘。</p>','创建盘点单',form=>{const bin=form.get('bin'),warehouse={A01:'原料仓',A02:'原料仓',B01:'包材仓',C01:'成品仓'}[bin];if(form.get('warehouse')!==warehouse)throw Error('所选库位与仓库不一致，请重新选择。');const id='PD-示例-'+String(docs.length+1).padStart(3,'0');docs.unshift({id,scope:warehouse+' / '+bin,warehouse,bin,state:'draft',owner:'张库管',created:stamp(),rows:[],events:[]});current=id;lineMode='all';lineSearch='';closeDialog();commit('盘点单已创建，确认范围后开始');});}
function start(){const d=currentDoc();if(docs.some(x=>x.id!==d.id&&x.bin===d.bin&&frozen(x)))return toast('该范围已有进行中的盘点，请先完成或取消原盘点单');openDialog('开始盘点并暂停所选范围收发',`<p class="review-note">本次范围：${esc(d.scope)}，包含子库位。</p><div class="notice">从现在起，该范围内的实际入库、领退料、调拨和报损暂停。<small>请同步通知现场暂停搬动所盘物料；其他库位继续正常作业。</small></div>`,'确认开始',()=>{d.state='counting';d.started=stamp();d.rows=d.bin==='A01'?fixedRows():d.bin==='A02'?[{...fixedRows()[0],location:'A02',book:100,reserved:0}]:d.bin==='B01'?[{id:'bottle',location:'B01',product:'330 mL 棕色玻璃瓶',spec:'24 个 / 箱',lot:'PK-261025-01',unit:'个',book:2400,reserved:0,actual:null,reason:'',note:'',previous:null}]:[{id:'beer',location:'C01',product:'小麦啤酒 330 mL',spec:'24 瓶 / 箱',lot:'FG-261030-01',unit:'瓶',book:480,reserved:0,actual:null,reason:'',note:'',previous:null}];event(d,'开始盘点 · 张库管','暂停本范围收发并生成账面快照');closeDialog();commit('已开始盘点，请按现场数量逐项录入');});}
function submit(){const d=currentDoc(),error=issue(d);if(error)return toast(error);const differences=d.rows.filter(changed);openDialog(differences.length?'提交盘点差异审批':'确认账实一致并结束',`<p class="review-note">已完成 ${d.rows.length} 项实盘，差异 ${differences.length} 项。</p><div class="notice">${esc(summary(d))}<small>${differences.length?'提交后锁定实盘记录并等待审批，所选范围继续暂停收发。':'无需生成差异调整，本单结束后恢复所选范围收发。'}</small></div>`,differences.length?'提交审批':'确认结束',()=>{d.state=differences.length?'review':'done';d.saved=stamp();event(d,differences.length?'提交差异审批 · 张库管':'账实一致，盘点完成 · 张库管',summary(d));closeDialog();commit(differences.length?'已提交审批，盘点范围继续暂停收发':'盘点完成，所选范围恢复收发');});}
function add(){const d=currentDoc();openDialog('补录发现的库存','<p class="review-note">仅补录已确认身份的现场实物，账面数量为零。批次不明时请先核查。</p><label>商品<select name="product"><option value="yeast">艾尔干酵母 · kg</option><option value="malt">澳洲皮尔森麦芽 · kg</option></select></label><label>已有批次<select name="lot"><option value="Y-261025-01">艾尔干酵母 / Y-261025-01</option><option value="MALT-261015-01">皮尔森麦芽 / MALT-261015-01</option></select></label><label>实物库位<input name="location" readonly value="'+esc(d.bin)+'"></label><label>实盘数量（kg）<input name="actual" type="number" min="0.001" step="any" required></label><label>发现说明<textarea name="note" required placeholder="说明物料来源与现场核查结果"></textarea></label>','添加到盘点明细',form=>{const malt=form.get('product')==='malt',lot=form.get('lot'),actual=Number(form.get('actual'));if(malt!==(lot==='MALT-261015-01'))throw Error('批次与商品不一致，请核对标签。');if(d.rows.some(r=>r.lot===lot&&r.location===d.bin))throw Error('该商品批次已经在明细中，请回到原明细录入。');if(!Number.isFinite(actual)||actual<=0)throw Error('请填写大于零的实盘数量。');if(!String(form.get('note')).trim())throw Error('请填写发现说明。');d.rows.push({id:'found-'+Date.now(),product:malt?'澳洲皮尔森麦芽':'艾尔干酵母',spec:malt?'25 kg / 袋':'500 g / 包',unit:'kg',location:d.bin,lot,book:0,reserved:0,actual,reason:'other',note:String(form.get('note')).trim(),previous:null});event(d,'补录账外实物 · 张库管',lot);closeDialog();commit('已补录，盘盈将随本单提交审批');});}
function recount(id){const d=currentDoc(),r=d.rows.find(x=>x.id===id);openDialog('记录复盘结果',`<p class="review-note">${esc(r.product)} · ${esc(r.lot)}<br>首次/上次实盘 ${format(r.actual)} ${esc(r.unit)}，账面 ${format(r.book)} ${esc(r.unit)}。</p><label>复盘数量（${esc(r.unit)}）<input name="actual" type="number" min="0" step="any" required></label><label>复盘说明<textarea name="note" required placeholder="说明复盘方法及结果"></textarea></label>`,'保存复盘',form=>{const actual=Number(form.get('actual')),note=String(form.get('note')).trim();if(!Number.isFinite(actual)||actual<0||!note)throw Error('请填写有效的复盘数量和说明。');r.recounts??=[];r.recounts.push({before:r.actual,after:actual,at:stamp(),note,by:'张库管'});r.actual=actual;event(d,'复盘 · 张库管',`${r.product}，${note}`);closeDialog();commit('已保存复盘结果，原记录保留');});}
function post(){const d=currentDoc();openDialog('确认盘点差异入账',`<p class="review-note">${esc(summary(d))}，已由负责人审批通过。</p><div class="notice">确认后生成本单对应的差异调整流水，并恢复 ${esc(d.scope)} 的收发。<small>完成后实盘和差异记录锁定。原批次质量限制继续保留。</small></div>`,'确认入账',()=>{if(d.state!=='approved')throw Error('本单当前不可重复入账。');d.movements=d.rows.filter(changed).map((r,i)=>({id:'MOVE-示例-'+(i+1),product:r.product,unit:r.unit,quantity:delta(r)}));d.state='done';event(d,'确认入账 · 张库管','生成差异流水，释放本单范围冻结');closeDialog();commit('盘点完成，差异已记录（演示），范围恢复收发');});}
const actions={create,start,submit,add,post,back:()=>{current=null;lineMode='all';lineSearch='';render();},filter:()=>{listSearch=$('list-search').value.trim();listState=$('list-state').value;renderList();},'line-search':()=>{lineSearch=$('line-search').value.trim();renderDetail();},save:()=>{const d=currentDoc();d.saved=stamp();commit('预览数据已暂存，刷新后可以继续');},approve:()=>{const d=currentDoc();if(d.state!=='review')return;d.state='approved';event(d,'审批通过 · 王负责人','差异已复核，等待库管确认入账');commit('模拟审批通过，当前尚未调整库存');},return:()=>{openDialog('模拟负责人退回','<label>退回意见<textarea name="note" required placeholder="请说明需要重新核查的事项"></textarea></label>','退回修改',form=>{const note=String(form.get('note')).trim();if(!note)throw Error('请填写退回意见。');const d=currentDoc();d.state='returned';d.returnNote=note;event(d,'审批退回 · 王负责人',note);closeDialog();commit('已退回，可修改或复盘后重新提交');});},cancel:()=>openDialog('取消本次盘点','<p class="review-note">取消不会调整库存，将撤销本单未结束的审批并恢复本范围收发。已录入内容保留用于追溯。</p><label>取消原因<textarea name="note" required></textarea></label>','确认取消',form=>{const note=String(form.get('note')).trim();if(!note)throw Error('请填写取消原因。');const d=currentDoc();d.state='cancelled';event(d,'取消盘点 · 张库管',note);closeDialog();commit('已取消本单，所选范围恢复收发');}),reset:()=>openDialog('重置示例数据','<p class="review-note">清除当前浏览器内的预览操作，恢复初始两张盘点单。</p>','重置示例',()=>{docs=initial();current=null;listSearch='';listState='';closeDialog();commit('示例已重置');})};
$('app').addEventListener('click',e=>{const a=e.target.closest('[data-action]'),o=e.target.closest('[data-open]'),m=e.target.closest('[data-mode]'),r=e.target.closest('[data-recount]');if(a)actions[a.dataset.action]?.();else if(o){current=o.dataset.open;lineMode='all';lineSearch='';render();}else if(m){lineMode=m.dataset.mode;renderDetail();}else if(r)recount(r.dataset.recount);});
$('app').addEventListener('change',e=>{const el=e.target;if(!el.dataset.row)return;const d=currentDoc();if(!editable(d))return;const r=d.rows.find(x=>x.id===el.dataset.row);if(el.dataset.field==='actual'){if(el.value!==''&&(!Number.isFinite(Number(el.value))||Number(el.value)<0)){toast('实盘数量必须是大于等于零的有效数字');el.value=r.actual??'';return;}r.actual=el.value===''?null:Number(el.value);if(!changed(r)){r.reason='';r.note='';}}else r[el.dataset.field]=el.value;const value=el.dataset.row,field=el.dataset.field;renderDetail();const target=document.querySelector(`[data-row="${value}"][data-field="${field}"]`);target?.focus();});
$('app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='list-search')actions.filter();if(e.key==='Enter'&&e.target.id==='line-search')actions['line-search']();});
$('dialog-form').addEventListener('submit',e=>{e.preventDefault();try{dialogCallback?.(new FormData(e.target));}catch(error){$('dialog-error').textContent=error.message;}});
$('close-dialog').addEventListener('click',closeDialog);$('cancel-dialog').addEventListener('click',closeDialog);$('mask').addEventListener('click',e=>{if(e.target===$('mask'))closeDialog();});
document.addEventListener('keydown',e=>{if($('mask').hidden)return;if(e.key==='Escape'){closeDialog();return;}if(e.key==='Tab'){const items=[...document.querySelector('.dialog').querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled),first=items[0],last=items.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===document.querySelector('.dialog'))){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();
</script>
</body></html>
